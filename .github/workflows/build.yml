name: build

# Runs on every pull request into dev or main and is reused by release.yml.
#   test     typecheck, the whole test suite (unit, real Electron end-to-end, real PDF layout, epubcheck, DOCX), and a
#            smoke test of the packaged Linux app
#   windows  builds the Windows installers (Cadrel, and Cadrel Reader which is released apart from it), smoke-tests the installed
#            layout, and attaches the installers to the run for one day (not on pull requests, to stay within the storage quota): Actions tab -> the run
#            -> Artifacts -> Cadrel-windows-installer and CadrelReader-windows-installer
#   android  builds the Android apps (Cadrel Write and Cadrel Reader) from packages/android-native and checks the APK (package, version, signature,
#            plugins). Off pull requests it attaches the APK for one day (Cadrel-android-apk, CadrelReader-android-apk), which release.yml publishes.
#            Signed with the release key when the ANDROID_KEYSTORE_* secrets exist (docs/ANDROID.md), otherwise with Android's debug key and
#            attached as ...-apk-debug, which is never published.
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:

env:
  # GitHub is retiring the Node 20 runtime for actions; run them on Node 24 now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, so the version can be compared with past releases
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Check VERSION
        run: |
          # a PR into main (or a push to it) is a release, so it must carry a new version
          if [ "${{ github.base_ref || github.ref_name }}" = "main" ]; then scripts/check-version.sh --newer; else scripts/check-version.sh; fi
      - name: Check Cadrel Reader's version
        run: |
          # Reader has its own version (packages/reader/VERSION) and tags (reader-vX.Y.Z); a release of it that touches Reader must raise it
          if [ "${{ github.base_ref || github.ref_name }}" = "main" ]; then scripts/check-reader-version.sh --newer; else scripts/check-reader-version.sh; fi
      - name: System tools used by the integration tests
        # xvfb: run Electron headless · poppler: pdfinfo/pdffonts · java + epubcheck: EPUB validation
        # libreoffice-writer: opens the generated DOCX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb poppler-utils default-jre-headless libreoffice-writer
          pip install epubcheck
      - run: npm ci
      - run: npx playwright install --with-deps chromium # the browser the capture-extension tests drive
      - run: npm run typecheck
      - run: npm run build:electron -w @cadrel/write
      - name: Tests
        # CI=true makes the Electron and PDF tests fail, instead of skip, when their environment is missing.
        run: xvfb-run -a npm test
      - name: Package the app for Linux and smoke-test it as installed
        env:
          # A build that is not of `main` is a development build (see scripts/sync-version.mjs): the app then
          # self-reports "<VERSION>-dev.<run number>", matching the tag release.yml publishes for it, so the
          # updater (and the installer's own filename) correctly tells it apart from a stable release. Scoped to
          # just this step: `npm test` above must see the plain VERSION, unsuffixed, like a contributor's own run.
          CADREL_DEV_BUILD: ${{ (github.base_ref || github.ref_name) != 'main' && format('dev.{0}', github.run_number) || '' }}
        run: |
          npm run pack -w @cadrel/shell
          xvfb-run -a packages/shell/release/linux-unpacked/cadrel --no-sandbox --smoke-test="$RUNNER_TEMP/smoke.json" || code=$?
          cat "$RUNNER_TEMP/smoke.json" || echo "The smoke test wrote no result file."
          exit "${code:-0}"
      - name: Run the shell end-to-end suite against the packaged app
        run: CADREL_PACKAGED_BIN="$PWD/packages/shell/release/linux-unpacked/cadrel" xvfb-run -a npx vitest run --root packages/shell test/shell.e2e.test.ts
      - name: Build Cadrel Reader and smoke-test it (starts in reader mode, author channels gone, first screen is Shared with me)
        run: |
          npm run build -w @cadrel/reader
          xvfb-run -a npx electron packages/reader --no-sandbox --smoke-test="$RUNNER_TEMP/reader-smoke.json" || code=$?
          cat "$RUNNER_TEMP/reader-smoke.json" || echo "The Reader smoke test wrote no result file."
          exit "${code:-0}"

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the installer
        shell: pwsh
        env:
          # Optional code signing. Add these repository secrets to sign the installer and avoid SmartScreen warnings:
          #   WIN_CSC_LINK (base64 .pfx or URL), WIN_CSC_KEY_PASSWORD
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # A build that is not of `main` is a development build (see scripts/sync-version.mjs): the app then
          # self-reports "<VERSION>-dev.<run number>", matching the tag release.yml publishes for it, so the
          # updater (and the installer's own filename) correctly tells it apart from a stable release.
          CADREL_DEV_BUILD: ${{ (github.base_ref || github.ref_name) != 'main' && format('dev.{0}', github.run_number) || '' }}
        run: |
          if ([string]::IsNullOrEmpty($env:CSC_LINK)) {
            Remove-Item Env:CSC_LINK, Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
            Write-Host 'No signing certificate configured: building an UNSIGNED installer.'
          }
          npm run dist -w @cadrel/shell
      - name: Smoke test the installed app (Write exports EPUB, PDF and DOCX; Market's native pieces load)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'smoke.json'
          # The program is "Cadrel.exe" for a stable build and "Cadrel Dev.exe" for a development build (see electron-builder.dev.yml).
          $exe = Get-ChildItem 'packages\shell\release\win-unpacked' -Filter 'Cadrel*.exe' | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          if (-not $exe) { throw 'No Cadrel program was found in win-unpacked.' }
          Write-Host "Smoke testing $($exe.Name)"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test=$out" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out } else { Write-Host 'The smoke test wrote no result file.' }
          if ($p.ExitCode -ne 0) { throw "Smoke test failed (exit code $($p.ExitCode))" }
      # Only release.yml needs the installers (it publishes them); a pull request run builds and smoke-tests them but stores nothing.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Cadrel-windows-installer
          path: packages/shell/release/Cadrel-Setup-*.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0 # installers are already compressed
      - name: Build the Cadrel Reader installer
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Same rule as above: a build that is not of `main` reports "<version>-dev.<run number>", matching the reader-v… tag it is published under.
          CADREL_DEV_BUILD: ${{ (github.base_ref || github.ref_name) != 'main' && format('dev.{0}', github.run_number) || '' }}
          # The Google Desktop OAuth client secret (repository secret GOOGLE_DESKTOP_CLIENT_SECRET, as in docs/imported/mdedit/DEVELOPMENT.md); without it Google sign-in says it is not set up in this build.
          CADREL_WRITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrEmpty($env:CSC_LINK)) {
            Remove-Item Env:CSC_LINK, Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
            Write-Host 'No signing certificate configured: building an UNSIGNED installer.'
          }
          npm run dist -w @cadrel/reader
      - name: Smoke test the installed Cadrel Reader
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'reader-smoke.json'
          $exe = 'packages\reader\release\win-unpacked\Cadrel Reader.exe'
          if (-not (Test-Path $exe)) { throw "No $exe was built." }
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test=$out" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out } else { Write-Host 'The smoke test wrote no result file.' }
          if ($p.ExitCode -ne 0) { throw "Reader smoke test failed (exit code $($p.ExitCode))" }
      # Only release.yml needs the installers (it publishes them); a pull request run builds and smoke-tests them but stores nothing.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: CadrelReader-windows-installer
          path: packages/reader/release/CadrelReader-Setup-*.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0 # installers are already compressed

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [write, reader]
    env:
      # Same rule as the Windows builds: a build that is not of `main` reports "<version>-dev.<run number>" (also its Android version code).
      CADREL_DEV_BUILD: ${{ (github.base_ref || github.ref_name) != 'main' && format('dev.{0}', github.run_number) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
        with:
          # The action's default list names a "tools" package that Google no longer publishes, which fails the step. The runner already has the SDK;
          # the action's real job here is accepting its licences, so Gradle can fetch the platform and build tools it needs.
          packages: platform-tools
      - run: npm ci
      - name: Release key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cadrel-release.keystore"
            echo "file=$RUNNER_TEMP/cadrel-release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with the debug key. This APK can be tried on a phone but is never published (docs/ANDROID.md)."
          fi
      - name: Prepare the Android project
        id: prep
        run: node packages/android-native/prepare.mjs ${{ matrix.app }}
      - name: Build the APK
        working-directory: ${{ steps.prep.outputs.app_dir }}/android
        env:
          CADREL_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          CADREL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CADREL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CADREL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # With the real key present, never fall back to the debug key if something is wrong with it.
          CADREL_REQUIRE_RELEASE_KEY: ${{ steps.key.outputs.file != '' && '1' || '' }}
        run: |
          ./gradlew assembleRelease --no-daemon
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/${{ steps.prep.outputs.apk }}"
      - name: Check the APK (package, version, signature, plugins)
        env:
          APK: ${{ runner.temp }}/apk/${{ steps.prep.outputs.apk }}
          VERSION: ${{ steps.prep.outputs.version }}
          CODE: ${{ steps.prep.outputs.version_code }}
        run: |
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          "$bt/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          echo "Register this key's SHA-1 with the Android OAuth client in Google Cloud (docs/ANDROID.md):"
          grep -i "SHA-1 digest" "$RUNNER_TEMP/certs.txt" || true
          "$bt/aapt2" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -E "^package:|launchable-activity|uses-permission" "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='$CODE' versionName='$VERSION'" "$RUNNER_TEMP/badging.txt" || { echo "::error::The APK's version is not $VERSION ($CODE)."; exit 1; }
          grep -q "launchable-activity" "$RUNNER_TEMP/badging.txt" || { echo "::error::The APK has no launcher activity."; exit 1; }
          grep -q "REQUEST_INSTALL_PACKAGES" "$RUNNER_TEMP/badging.txt" || { echo "::error::The APK cannot open Android's installer (needed to update itself)."; exit 1; }
          for plugin in AppUpdatePlugin DriveAuthPlugin ExternalBrowserPlugin; do
            unzip -p "$APK" 'classes*.dex' | grep -aq "nativeplugins/$plugin" || { echo "::error::$plugin is not in the APK."; exit 1; }
          done
          echo "APK checks passed."
      # Only release.yml needs the APK (it publishes it); a pull request run builds and checks it but stores nothing.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ${{ matrix.app == 'write' && 'Cadrel' || 'CadrelReader' }}-android-apk${{ steps.key.outputs.file == '' && '-debug' || '' }}
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0 # an APK is already compressed
