name: pages

# Publishes the small web pages the app links to (today: the beta-reader invitation page) to GitHub Pages.
#   main  ->  https://blaashford-ux.github.io/cadrel/join/        (what released apps use)
#   dev   ->  https://blaashford-ux.github.io/cadrel/dev/join/    (for trying a change before it is released)
# A repository has one Pages site, so each run builds it from both branches: whichever branch triggered it, the other keeps its pages.
# One-time setup in the repository: Settings -> Pages -> Source: GitHub Actions, and Settings -> Environments -> github-pages ->
# Deployment branches: allow both main and dev.
on:
  push:
    branches: [main, dev]
    paths:
      - 'packages/write/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  pages: write
  id-token: write # lets deploy-pages prove to GitHub that this run may publish

# One deployment at a time; a newer run replaces one still waiting, but never cancels one that is publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        id: main
        uses: actions/checkout@v4
        with: { ref: main, path: main }
      - name: Check out dev
        id: dev
        uses: actions/checkout@v4
        with: { ref: dev, path: dev }
      - name: Assemble the site
        run: |
          mkdir -p _site/dev
          # A branch that has no pages yet simply contributes none.
          if [ -d main/packages/write/site ]; then cp -R main/packages/write/site/. _site/; fi
          if [ -d dev/packages/write/site ]; then cp -R dev/packages/write/site/. _site/dev/; fi
          touch _site/.nojekyll
          echo "Published pages:"; find _site -type f | sort
          if [ -z "$(find _site -name index.html)" ]; then echo "::error::Neither main nor dev has packages/write/site yet, so there is nothing to publish."; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
