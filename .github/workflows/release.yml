name: release

# Merging builds and publishes a GitHub release:
#   push to main -> release  vX.Y.Z           (X.Y.Z from the VERSION file)
#   push to dev  -> pre-release vX.Y.Z-dev.N  (N = this workflow's run number)
# The installer is also on the run page as the "Cadrel-windows-installer" artifact.
# The studio server (Cloudflare Worker) is deployed in the same run: dev -> cadrel-api-dev, main -> cadrel-api, after
# applying D1 migrations. It needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them
# the deploy is skipped with a warning and the release still publishes.
on:
  push:
    branches: [main, dev]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and its tag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Cadrel-windows-installer
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(scripts/check-version.sh)"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            tag="v${version}"; flags=(--latest)
          else
            tag="v${version}-dev.${GITHUB_RUN_NUMBER}"; flags=(--prerelease)
          fi
          cd dist
          installer="$(ls Cadrel-Setup-*.exe | head -n1)"
          sha256sum "$installer" > SHA256SUMS.txt
          cat > ../notes.md <<NOTES
          ## Install (Windows 10 / 11)

          1. Download **${installer}** below and run it.
          2. Windows SmartScreen may say *"Windows protected your PC"* because this installer is not code-signed yet.
             Click **More info → Run anyway**.
          3. Choose an install folder (no administrator rights needed) and finish the wizard.

          Your settings stay in your user profile and are kept if you uninstall.

          **Verify the download (optional):** in PowerShell, \`Get-FileHash .\\${installer} -Algorithm SHA256\` should match \`SHA256SUMS.txt\`:

          \`\`\`
          $(cat SHA256SUMS.txt)
          \`\`\`

          ## What's changed
          NOTES
          sed -i 's/^          //' ../notes.md
          gh release create "$tag" "$installer" SHA256SUMS.txt --target "$GITHUB_SHA" --title "Cadrel ${tag#v}" --notes-file ../notes.md --generate-notes "${flags[@]}"

  deploy-worker:
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for Cloudflare credentials
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the Worker deploy."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.cf.outputs.have == 'true'
        with: { node-version: 22, cache: npm }
      - run: npm ci
        if: steps.cf.outputs.have == 'true'
      - name: Migrate and deploy
        if: steps.cf.outputs.have == 'true'
        working-directory: packages/worker
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then envflag=""; db=cadrel-db; else envflag="--env dev"; db=cadrel-dev-db; fi
          npx wrangler d1 migrations apply "$db" $envflag --remote
          npx wrangler deploy $envflag 2>&1 | tee deploy.log
          url="$(grep -o 'https://[^ ]*workers.dev' deploy.log | head -n1)"
          echo "Deployed: $url"
          echo "url=$url" > "$RUNNER_TEMP/worker-url"
      - name: Smoke test /v1/health
        if: steps.cf.outputs.have == 'true'
        run: |
          url="$(sed 's/^url=//' "$RUNNER_TEMP/worker-url")"
          for i in 1 2 3 4 5; do
            code="$(curl -s -o health.json -w '%{http_code}' "$url/v1/health" || true)"
            [ "$code" = "200" ] && break
            sleep 5
          done
          cat health.json; echo
          [ "$code" = "200" ]
